name: Update data
# Checks for newly posted EMSA reports three times a month, rebuilds, tests, and commits
# only if something changed. A failed parse or test never overwrites the published data;
# it opens an issue instead so a person can look.
on:
  workflow_dispatch:   # scheduled runs turned off: this belongs to the abandoned OffloadWatch project
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pdfplumber pandas scikit-learn shapely pyshp pytest
      - name: Look for new reports and geo files
        id: fetch
        run: python pipeline/fetch.py | tee fetch.log
      - name: Rebuild
        run: python pipeline/run.py
      - name: Test
        run: python -m pytest -q
      - name: Commit if data changed
        run: |
          git config user.name "offloadwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Data update: $(grep -o 'NEW=[0-9]*' fetch.log | tail -1) new report(s)"
            git push
          fi
      - name: Open an issue if anything failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Data update failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled data update failed. The published data was not changed. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A new EMSA report may use a layout the parser does not know yet."
